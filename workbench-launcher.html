    }

    function clearDropState() {
      document.querySelectorAll(".drop-target, .insert-before, .insert-after").forEach((row) => {
        row.classList.remove("drop-target", "insert-before", "insert-after");
      });
    }

    function moveItem(sourceId, targetId, position) {
      if (sourceId === targetId) return;
      const source = historyItems.find((item) => item.id === sourceId);
      const target = historyItems.find((item) => item.id === targetId);
      if (!source || !target) return;

      if (position === "inside" && target.type === "project" && source.type === "task") {
        source.parentId = target.id;
        target.expanded = true;
        historyItems = historyItems.filter((item) => item.id !== sourceId);
        const lastChild = historyItems.reduce((last, item, index) => item.parentId === target.id ? index : last, historyItems.indexOf(target));
        historyItems.splice(lastChild + 1, 0, source);
      } else {
        source.parentId = target.parentId || null;
        historyItems = historyItems.filter((item) => item.id !== sourceId);
        let targetIndex = historyItems.findIndex((item) => item.id === targetId);
        if (position === "after") {
          targetIndex += 1;
          if (target.type === "project") {
            while (targetIndex < historyItems.length && historyItems[targetIndex].parentId === target.id) targetIndex += 1;
          }
        }
        historyItems.splice(targetIndex, 0, source);
      }
      source.editedAt = Date.now();
      renderHistory();
    }

    function makeHistoryRow(item) {
      const row = document.createElement("div");
      row.className = `history-row${item.parentId ? " child" : ""}`;
      row.dataset.id = item.id;
      row.innerHTML = `<span class="history-icon">${item.type === "project" ? (item.expanded === false ? "▸" : "▾") : "·"}</span><span class="history-name">${item.name}</span>`;
      if (item.type === "project") {
        row.setAttribute("aria-expanded", String(item.expanded !== false));
        row.addEventListener("click", () => {
          if (suppressProjectClick) return;
          item.expanded = item.expanded === false;
          renderHistory();
        });
      }

      row.addEventListener("pointerdown", () => {
        clearTimeout(holdTimer);
        holdTimer = setTimeout(() => {
          row.draggable = true;
          row.classList.add("drag-ready");
          showToast(`可拖动：${item.name}`);
        }, 350);
      });
      ["pointerup", "pointercancel", "pointerleave"].forEach((eventName) => {
        row.addEventListener(eventName, () => clearTimeout(holdTimer));
      });
      row.addEventListener("dragstart", (event) => {
        draggedId = item.id;
        suppressProjectClick = true;
        row.classList.add("dragging");
        event.dataTransfer.effectAllowed = "move";
        event.dataTransfer.setData("text/plain", item.id);
      });
      row.addEventListener("dragend", () => {
        draggedId = null;
        row.draggable = false;
        row.classList.remove("dragging", "drag-ready");
        clearDropState();
        setTimeout(() => { suppressProjectClick = false; }, 0);
      });
      row.addEventListener("dragover", (event) => {
        event.preventDefault();
        clearDropState();
        const rect = row.getBoundingClientRect();
        const ratio = (event.clientY - rect.top) / rect.height;
        if (item.type === "project" && ratio > .25 && ratio < .75) row.classList.add("drop-target");
        else row.classList.add(ratio < .5 ? "insert-before" : "insert-after");
      });
      row.addEventListener("drop", (event) => {
        event.preventDefault();
        const position = row.classList.contains("drop-target") ? "inside" : row.classList.contains("insert-before") ? "before" : "after";
        moveItem(draggedId || event.dataTransfer.getData("text/plain"), item.id, position);
        clearDropState();
      });
      return row;
    }

    function renderHistory() {
      historyList.replaceChildren(...orderedItems().map(makeHistoryRow));
      renderSearchResults(searchInput.value);
    }

    function renderSearchResults(keyword = "") {
      const query = keyword.trim().toLowerCase();
      const matches = historyItems
        .filter((item) => !query || item.name.toLowerCase().includes(query))
        .sort((a, b) => b.editedAt - a.editedAt);
      searchResults.innerHTML = matches.length
        ? matches.map((item) => `<button class="search-result" data-id="${item.id}">${item.name}<small>${item.type === "project" ? "项目" : "任务"} · 最近编辑</small></button>`).join("")
        : '<div class="search-result">没有匹配结果</div>';
    }

    document.querySelector("#search-toggle").addEventListener("click", (event) => {
      event.stopPropagation();
      searchPanel.classList.toggle("open");
      if (searchPanel.classList.contains("open")) {
        renderSearchResults(searchInput.value);
        searchInput.focus();
      }
    });
    searchPanel.addEventListener("click", (event) => event.stopPropagation());
    document.addEventListener("click", () => searchPanel.classList.remove("open"));
    searchInput.addEventListener("input", () => renderSearchResults(searchInput.value));

    const projectModal = document.querySelector("#project-modal");
    const projectName = document.querySelector("#project-name");
    document.querySelector("#create-project").addEventListener("click", () => {
      projectModal.hidden = false;
      projectName.value = "";
      document.querySelector("#project-name-count").textContent = "0";
      projectName.focus();
    });
    projectName.addEventListener("input", () => {
      document.querySelector("#project-name-count").textContent = projectName.value.length;
    });
    document.querySelector("#cancel-project").addEventListener("click", () => projectModal.hidden = true);
    document.querySelector("#confirm-project").addEventListener("click", () => {
      historyItems.push({
        id: `p-${Date.now()}`,
        type: "project",
        name: projectName.value.trim() || "项目",
        editedAt: Date.now(),
        expanded: true
      });
      projectModal.hidden = true;
      renderHistory();
    });
    projectModal.addEventListener("click", (event) => {
      if (event.target === projectModal) projectModal.hidden = true;
    });

    renderHistory();

    if (new URLSearchParams(location.search).has("collapsed")) {
      setSidebarCollapsed(true);
    }

    if (new URLSearchParams(location.search).has("review")) {
      document.body.classList.add("ui-review-mode");

      const markerLayer = document.createElement("div");
      markerLayer.className = "review-marker-layer";
      const note = document.createElement("aside");
      note.className = "interaction-note";
      note.hidden = true;
      const modeSwitch = document.createElement("div");
      modeSwitch.className = "review-mode-switch";
      modeSwitch.innerHTML = '<button type="button" data-mode="clean">纯净模式</button><button type="button" data-mode="review" class="active">评审模式</button><button type="button" data-mode="edit">修改模式</button>';
      const copyToast = document.createElement("div");
      copyToast.className = "copy-toast";
      copyToast.setAttribute("role", "status");
      document.body.append(markerLayer, note, modeSwitch, copyToast);
      let reviewEnabled = true;
      let editEnabled = false;
      let editHover;
      let copyToastTimer;

      const interactiveSelector = [
        "button",
        "select",
        "textarea",
        "input:not([type='file'])",
        ".history-row"
      ].join(",");

      const labelOf = (element) => {
        if (element.classList.contains("history-row")) return element.querySelector(".history-name")?.textContent || "历史项目";
        return element.getAttribute("aria-label")
          || element.getAttribute("title")
          || element.textContent.trim().replace(/\s+/g, " ").slice(0, 32)
          || element.getAttribute("placeholder")
          || "交互组件";
      };

      const descriptionOf = (element) => {
        if (element.matches("#sidebar-toggle")) return "点击收起侧边栏。收起后仅保留展开、新任务、企业档案、历史和退出图标。";
        if (element.matches("#sidebar-expand, #history-toggle")) return "点击重新展开侧边栏，恢复完整导航、搜索和历史任务列表。";
        if (element.matches("#search-toggle")) return "点击展开搜索输入框；根据关键词实时匹配历史任务和项目，结果按最近编辑时间由近到远排序。";
        if (element.matches("#search-input")) return "输入任务或项目关键词，搜索结果随输入实时刷新。";
        if (element.matches(".search-result")) return "点击打开对应的历史任务或项目。具体打开后的页面交互待后续对齐。";
        if (element.matches("#new-task-nav")) return "点击返回功能首页初始状态：展开侧栏、清空当前输入和附件，并恢复“选品测款”默认场景。";
        if (element.matches("#archive-nav")) return "点击进入企业档案列表。列表页面 UI 待提供页面代码后接入。";
        if (element.matches("#create-project")) return "点击打开创建项目弹窗。项目名称最多 40 个字符；未填写时默认命名为“项目”。";
        if (element.matches(".history-row")) {
          const item = historyItems.find((entry) => entry.id === element.dataset.id);
          return item?.type === "project"
            ? "点击展开或收起项目。长按约 350ms 后可拖动排序；移动项目时，其全部子任务跟随移动。任务可拖入项目。"
            : "点击打开历史任务。长按约 350ms 后可拖动到列表任意位置或任意项目中；拖动时展示插入线。";
        }
        if (element.matches(".back-saas")) return "退出入口。当前仅保留按钮样式，不配置具体退出流程。";
        if (element.matches(".scene-tab")) return "点击切换业务场景，并同步更新任务输入框的示例提示；不会自动调用外部数据。";
        if (element.matches("#prompt")) return "输入本次任务目标与条件。不同场景展示不同示例提示，内容随新任务提交。";
        if (element.matches("#attach")) return "点击选择并上传本任务需要的图片、文档、表格等资料。资料解析在任务内进行。";
        if (element.matches(".archive-select")) return "为本次任务选择一个企业档案，或选择暂不使用。一个任务仅应用一个档案。";
        if (element.matches("#send")) return "点击发起新任务。任务描述为空时提示用户补充目标；有内容时进入对应 Agent 的任务流程。";
        if (element.matches(".create")) return "仅在企业档案为空时展示。点击进入企业档案创建页。";
        if (element.matches("#project-name")) return "输入项目文件夹名称，最多 40 个字符；不填写则使用默认名称“项目”。";
        if (element.matches("#confirm-project")) return "创建项目，并将新项目显示在历史列表中。";
        if (element.matches("#cancel-project")) return "关闭创建项目弹窗，不保存输入内容。";
        if (element.matches("#back-home")) return "返回功能首页。该按钮属于企业档案页面占位状态。";
        return `点击触发“${labelOf(element)}”操作，详细交互待后续页面对齐。`;
      };

      let activeElement;
      let markerFrame;

      const visible = (element) => {
        const rect = element.getBoundingClientRect();
        const style = getComputedStyle(element);
        return rect.width > 0 && rect.height > 0 && style.display !== "none" && style.visibility !== "hidden";
      };

      const placeNote = (element) => {
        if (!reviewEnabled) return;
        activeElement?.removeAttribute("data-review-active");
        activeElement = element;
        activeElement.setAttribute("data-review-active", "true");
        note.innerHTML = `<strong>${labelOf(element)}</strong>${descriptionOf(element)}`;
        note.hidden = false;

        const rect = element.getBoundingClientRect();
        const noteWidth = 310;
        const left = rect.right + 12 + noteWidth <= innerWidth
          ? rect.right + 12
          : Math.max(14, rect.left - noteWidth - 12);
        note.style.left = `${left}px`;
        note.style.top = `${Math.min(Math.max(14, rect.top), innerHeight - note.offsetHeight - 14)}px`;
      };

      const refreshMarkers = () => {
        cancelAnimationFrame(markerFrame);
        markerFrame = requestAnimationFrame(() => {
          markerLayer.replaceChildren();
          if (!reviewEnabled) return;
          document.querySelectorAll(interactiveSelector).forEach((element) => {
            if (!visible(element) || markerLayer.contains(element) || note.contains(element) || modeSwitch.contains(element)) return;
            const rect = element.getBoundingClientRect();
            const dot = document.createElement("button");
            dot.className = "review-dot";
            dot.type = "button";
            dot.title = `查看交互说明：${labelOf(element)}`;
            dot.style.left = `${Math.min(innerWidth - 13, rect.right - 5)}px`;
            dot.style.top = `${Math.max(3, rect.top - 5)}px`;
            dot.addEventListener("click", (event) => {
              event.preventDefault();
              event.stopPropagation();
              placeNote(element);
            });
            markerLayer.appendChild(dot);
          });
        });
      };

      document.addEventListener("click", (event) => {
        if (!reviewEnabled || markerLayer.contains(event.target) || note.contains(event.target) || modeSwitch.contains(event.target)) return;
        const target = event.target.closest(interactiveSelector);
        if (target && visible(target)) {
          setTimeout(() => {
            placeNote(target);
            refreshMarkers();
          }, 0);
        } else {
          activeElement?.removeAttribute("data-review-active");
          activeElement = null;
          note.hidden = true;
        }
      }, true);

      modeSwitch.addEventListener("click", (event) => {
        const button = event.target.closest("button[data-mode]");
        if (!button) return;
        reviewEnabled = button.dataset.mode === "review";
        editEnabled = button.dataset.mode === "edit";
        document.body.classList.toggle("review-clean", !reviewEnabled);
        document.body.classList.toggle("review-edit", editEnabled);
        modeSwitch.querySelectorAll("button").forEach((item) => item.classList.toggle("active", item === button));
        if (!reviewEnabled || editEnabled) {
          activeElement?.removeAttribute("data-review-active");
          activeElement = null;
          note.hidden = true;
        }
        if (!editEnabled) {
          editHover?.removeAttribute("data-edit-hover");
          editHover = null;
        }
        refreshMarkers();
      });

      const componentTarget = (source) => source.closest([
        "button", "select", "textarea", "input:not([type='file'])",
        ".history-row", ".prompt-box", ".scene-tabs", ".archive-prompt",
        ".search-panel", ".sidebar", ".launcher", ".profile-page",
        ".modal", "h1", "main"
      ].join(","));

      const selectorOf = (element) => {
        if (element.id) return `#${element.id}`;
        const stableClasses = [...element.classList].filter((name) =>
          !["active", "open", "show", "child", "dragging", "drop-target", "insert-before", "insert-after", "review-selected"].includes(name)
        );
        return stableClasses.length ? `.${stableClasses.join(".")}` : element.tagName.toLowerCase();
      };

      const componentNameOf = (element) => {
        const known = [
          ["#prompt", "任务描述"],
          [".prompt-box", "任务输入区"],
          [".scene-tabs", "业务场景选择"],
          ["#headline", "首页标题"],
          [".sidebar", "应用侧边栏"],
          ["#history-list", "历史任务列表"],
          [".archive-select", "企业档案选择"],
          ["#attach", "添加附件"],
          ["#send", "发起任务"],
          ["#sidebar-toggle", "折叠侧栏"],
          ["#sidebar-expand", "展开侧栏"],
          ["#search-toggle", "搜索"],
          ["#create-project", "创建项目"],
          [".back-saas", "退出"]
        ];
        const matched = known.find(([selector]) => element.matches(selector));
        const name = matched?.[1] || labelOf(element);
        return `${name}（${selectorOf(element)}）`;
      };

      const copyText = async (text) => {
        try {
          await navigator.clipboard.writeText(text);
        } catch {
          const helper = document.createElement("textarea");
          helper.value = text;
          helper.style.position = "fixed";
          helper.style.opacity = "0";
          document.body.appendChild(helper);
          helper.select();
          document.execCommand("copy");
          helper.remove();
        }
        copyToast.textContent = `已复制 ${text}`;
        copyToast.classList.add("show");
        clearTimeout(copyToastTimer);
        copyToastTimer = setTimeout(() => copyToast.classList.remove("show"), 1800);
      };

      document.addEventListener("mousemove", (event) => {
        if (!editEnabled || modeSwitch.contains(event.target)) return;
        const target = componentTarget(event.target);
        if (target === editHover) return;
        editHover?.removeAttribute("data-edit-hover");
        editHover = target;
        editHover?.setAttribute("data-edit-hover", "true");
      }, true);

      document.addEventListener("click", (event) => {
        if (!editEnabled || modeSwitch.contains(event.target)) return;
        const target = componentTarget(event.target);
        if (!target) return;
        event.preventDefault();
        event.stopImmediatePropagation();
        copyText(componentNameOf(target));
      }, true);

      const observer = new MutationObserver((mutations) => {
        if (mutations.every((mutation) => markerLayer.contains(mutation.target) || note.contains(mutation.target) || modeSwitch.contains(mutation.target))) return;
        refreshMarkers();
      });
      observer.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ["class", "hidden", "aria-expanded"] });
      addEventListener("resize", refreshMarkers);
      addEventListener("scroll", refreshMarkers, true);
      refreshMarkers();
    }
  </script>
</body>
</html>
